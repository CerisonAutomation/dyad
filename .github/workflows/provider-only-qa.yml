name: Provider-only QA

on:
  pull_request:
    paths:
      - "src/**"
      - "shared/browser_mcp_presets.ts"
      - "scripts/qa/**"
      - "scripts/audit/**"
      - ".claude/skills/replica-*/**"
      - ".claude/skills/replica-provenance.json"
      - ".claude/skills/REPLICA-LICENSE"
      - "package*.json"
      - ".github/workflows/provider-only-qa.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: provider-only-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run qa:skills
      - run: npm run qa:agent2
      - name: Check focused coding quality, speech and web-reader types
        run: |
          npx tsgo -p scripts/qa/tsconfig.coding-quality.json
          npx tsgo -p scripts/qa/tsconfig.prompt-improver.json
          npx tsgo -p scripts/qa/tsconfig.local-tts.json
          npx tsgo -p scripts/qa/tsconfig.web-reader.json
      - run: npm run audit:app
      - run: npm run qa:app-map
      - name: Check standalone network policy and browser presets
        run: npx tsgo --ignoreConfig --noEmit --strict --skipLibCheck --moduleResolution bundler --module esnext --target es2022 --lib es2022,dom --types node src/main/dyad_cloud_policy.ts src/main/provider_only_legacy_fetch.ts shared/browser_mcp_presets.ts

  browser-mcp-handshake:
    # No external MCP programs on untrusted PR runs. No model credentials needed.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run qa:browser-mcp
